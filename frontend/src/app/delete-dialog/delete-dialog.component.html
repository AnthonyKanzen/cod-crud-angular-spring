<div class="dialog-content">
  <div class="dialog-title">
    <h2>Excluir curso</h2>
  </div>

  <p>Deseja realmente excluir este curso?</p>

  <mat-dialog-actions>
    <button mat-flat-button (click)="confirm()">Excluir</button>
    <button mat-flat-button (click)="cancel()">Cancelar</button>
  </mat-dialog-actions>
</div>
